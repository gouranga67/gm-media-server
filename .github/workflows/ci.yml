name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Audit public source
        run: npm run audit:public

      - name: Type-check web app
        run: npm run typecheck:web

      - name: Build web app
        run: npm run build:web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/core/requirements.txt

      - name: Install core dependencies
        run: python -m pip install --requirement services/core/requirements.txt

      - name: Install render test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Run core unit tests
        env:
          PYTHONPATH: services/core
        run: python -m unittest discover -s services/core/tests -v

      - name: Compile Python source
        run: python -m py_compile services/core/app/*.py scripts/*.py

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
